<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Masuk · Umaira AI</title>
<link rel="icon" href="/assets/umaira-logo-gradient.svg" type="image/svg+xml">
<style>
:root{--bg:#07050f;--card:rgba(22,15,44,.78);--line:rgba(167,139,250,.22);--text:#f5f3ff;--muted:#a79fc4;--accent:#8b5cf6;--danger:#fca5a5}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;min-height:100vh;padding:24px 16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 0%,rgba(124,58,237,.35),transparent 70%),radial-gradient(40% 40% at 90% 100%,rgba(34,211,238,.12),transparent 70%)}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;text-align:center}
.brand img{width:56px;height:56px;filter:drop-shadow(0 0 14px rgba(124,58,237,.55))}
h1{margin:0;font-size:22px;font-weight:600}
.sub{margin:0;color:var(--muted);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:9px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(139,92,246,.28);color:var(--text)}
#googleWrap{display:flex;justify-content:center;min-height:44px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input{width:100%;background:rgba(10,7,22,.7);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.pw{position:relative}
.pw input{padding-right:78px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;padding:8px 10px;cursor:pointer;border-radius:8px}
.primary{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8b5cf6,#6d28d9);cursor:pointer}
.primary:disabled{opacity:.6;cursor:default}
.error{min-height:20px;margin:12px 0 0;color:var(--danger);font-size:13px;text-align:center}
.foot{margin:14px 0 0;color:var(--muted);font-size:12px;text-align:center}
[hidden]{display:none!important}
</style>
<script>(function(){try{var p=localStorage.getItem("umaira-theme-preference")||"light";var d=p==="dark"||p==="gelap"||((p==="system"||p==="sistem"||p==="auto")&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-uui",d?"dark":"light");}catch(e){document.documentElement.setAttribute("data-uui","light");}})();</script>
<link rel="stylesheet" href="/login-theme.css">
<link rel="stylesheet" href="/workspace-theme.css">
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="/assets/umaira-logo-gradient.svg" alt="Umaira" width="56" height="56">
    <h1 id="title">Selamat datang kembali</h1>
    <p class="sub" id="subtitle">Masuk untuk melanjutkan obrolan Anda</p>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-mode="login" aria-selected="true">Masuk</button>
    <button type="button" class="tab" role="tab" data-mode="register" aria-selected="false">Daftar</button>
  </div>

  <div id="googleSection">
    <div id="googleWrap"><div id="googleBtn"></div></div>
    <div class="divider">atau</div>
  </div>

  <form id="authForm" novalidate>
    <div class="field" id="nameField" hidden>
      <label for="name">Nama</label>
      <input id="name" type="text" autocomplete="name" maxlength="60" placeholder="Nama Anda">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
    </div>
    <div class="field">
      <label for="password">Kata sandi</label>
      <div class="pw">
        <input id="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Minimal 8 karakter">
        <button type="button" id="togglePw" aria-label="Tampilkan kata sandi">Lihat</button>
      </div>
    </div>
    <p class="forgot" id="forgotRow"><button type="button" id="forgotBtn" class="linkbtn">Lupa kata sandi?</button></p>
    
<button class="primary" id="submitBtn" type="submit">Masuk</button>
    <p class="error" id="error" role="alert" aria-live="polite"></p>
  </form>
  <section id="resetPanel" hidden>
    <div class="brand">
      <h1>Atur ulang kata sandi</h1>
      <p class="sub">Masukkan email akunmu. Kami kirim kode 6 digit ke email itu.</p>
    </div>
    <form id="resetForm" novalidate>
      <div class="field">
        <label for="rEmail">Email</label>
        <input id="rEmail" type="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
      </div>
      <div id="rStep2" hidden>
        <div class="field">
          <label for="rCode">Kode 6 digit</label>
          <input id="rCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
        </div>
        <div class="field">
          <label for="rPass">Kata sandi baru</label>
          <input id="rPass" type="password" autocomplete="new-password" maxlength="128" placeholder="Minimal 8 karakter">
        </div>
      </div>
      <button class="primary" id="rSubmit" type="submit">Kirim kode</button>
      <button type="button" id="rResend" class="linkbtn" hidden>Kirim ulang kode</button>
      <button type="button" id="rBack" class="linkbtn">Kembali ke halaman masuk</button>
      <p class="error" id="rError" role="alert" aria-live="polite"></p>
      <p class="ok" id="rOk" role="status"></p>
    </form>
  </section>
  
<p class="foot">Obrolan dan galeri Anda tersimpan terpisah untuk setiap akun.</p>
</main>

<script>
(function () {
  var mode = "login";
  var $ = function (id) { return document.getElementById(id); };
  var tabs = document.querySelectorAll(".tab");

  function setError(msg) { $("error").textContent = msg || ""; }
  function busy(on) {
    $("submitBtn").disabled = on;
    $("submitBtn").textContent = on ? "Memproses..." : (mode === "register" ? "Daftar" : "Masuk");
  }
  function goChat() { location.replace("/"); }

  function setMode(m) {
    mode = m;
    tabs.forEach(function (t) { t.setAttribute("aria-selected", String(t.getAttribute("data-mode") === m)); });
    $("nameField").hidden = m !== "register";
    $("title").textContent = m === "register" ? "Buat akun Umaira" : "Selamat datang kembali";
    $("subtitle").textContent = m === "register" ? "Daftar untuk mulai mengobrol dengan Umaira" : "Masuk untuk melanjutkan obrolan Anda";
    $("password").setAttribute("autocomplete", m === "register" ? "new-password" : "current-password");
    $("submitBtn").textContent = m === "register" ? "Daftar" : "Masuk";
    setError("");
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { setMode(t.getAttribute("data-mode")); }); });

  $("togglePw").addEventListener("click", function () {
    var show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    this.textContent = show ? "Sembunyikan" : "Lihat";
    this.setAttribute("aria-label", show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi");
  });

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.error || "Terjadi kesalahan. Coba lagi.");
        return d;
      });
    });
  }

  $("authForm").addEventListener("submit", function (e) {
    e.preventDefault();
    setError("");
    var name = $("name").value.trim();
    var email = $("email").value.trim();
    var password = $("password").value;
    if (mode === "register" && !name) return setError("Nama wajib diisi.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setError("Format email belum benar.");
    if (password.length < 8 || password.length > 128) return setError("Kata sandi harus 8–128 karakter.");
    busy(true);
    var body = mode === "register" ? { name: name, email: email, password: password } : { email: email, password: password };
    post("/api/auth/" + mode, body).then(goChat).catch(function (err) {
      setError(err.message);
      busy(false);
    });
  });

  function onCredential(resp) {
    setError("");
    busy(true);
    post("/api/auth/google", { credential: resp.credential }).then(goChat).catch(function (err) {
      setError(err.message);
      busy(false);
    });
  }

  function initGoogle() {
    fetch("/api/auth/google/config", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.clientId) throw new Error("no client");
        return new Promise(function (ok, no) {
          var s = document.createElement("script");
          s.src = "https://accounts.google.com/gsi/client";
          s.async = true;
          s.onload = ok;
          s.onerror = no;
          document.head.appendChild(s);
        }).then(function () {
          google.accounts.id.initialize({ client_id: cfg.clientId, callback: onCredential });
          google.accounts.id.renderButton($("googleBtn"), {
            theme: (document.documentElement.getAttribute("data-uui") === "dark" ? "filled_black" : "outline"), size: "large", shape: "pill", text: "continue_with",
            width: Math.min(320, $("googleWrap").clientWidth || 320)
          });
        });
      })
      .catch(function () { $("googleSection").hidden = true; });
  }
  initGoogle();

  /* ===== LUPA KATA SANDI (OTP lewat email) ===== */
  var rStep = 1;
  var rTimer = null;
  function rErr(m) { $("rError").textContent = m || ""; if (m) $("rOk").textContent = ""; }
  function rOk(m) { $("rOk").textContent = m || ""; if (m) $("rError").textContent = ""; }
  function rBusy(on, label) {
    $("rSubmit").disabled = on;
    $("rSubmit").textContent = on ? "Memproses..." : label;
  }
  function showReset(on) {
    var main = document.querySelector("main.card");
    [main.querySelector(".brand"), main.querySelector(".tabs"), $("googleSection"), $("authForm")].forEach(function (el) {
      if (el) el.style.display = on ? "none" : "";
    });
    $("resetPanel").hidden = !on;
    if (on) {
      $("rEmail").value = $("email").value.trim();
      $("rEmail").readOnly = false;
      $("rStep2").hidden = true;
      $("rResend").hidden = true;
      $("rCode").value = "";
      $("rPass").value = "";
      rStep = 1;
      rErr("");
      rOk("");
      $("rSubmit").textContent = "Kirim kode";
      $("rEmail").focus();
    }
  }
  function rCooldown() {
    var left = 60;
    clearInterval(rTimer);
    $("rResend").hidden = false;
    $("rResend").disabled = true;
    $("rResend").textContent = "Kirim ulang kode (60 dtk)";
    rTimer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(rTimer);
        $("rResend").disabled = false;
        $("rResend").textContent = "Kirim ulang kode";
      } else {
        $("rResend").textContent = "Kirim ulang kode (" + left + " dtk)";
      }
    }, 1000);
  }

  $("forgotBtn").addEventListener("click", function () { showReset(true); });
  $("rBack").addEventListener("click", function () { showReset(false); });
  tabs.forEach(function (t) {
    t.addEventListener("click", function () { $("forgotRow").hidden = t.getAttribute("data-mode") !== "login"; });
  });

  $("rResend").addEventListener("click", function () {
    var email = $("rEmail").value.trim().toLowerCase();
    $("rResend").disabled = true;
    post("/api/auth/forgot-password", { email: email }).then(function (d) {
      rOk(d.message || "Kode dikirim ulang.");
      rCooldown();
    }).catch(function (err) { rErr(err.message); $("rResend").disabled = false; });
  });

  $("resetForm").addEventListener("submit", function (e) {
    e.preventDefault();
    rErr("");
    var email = $("rEmail").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return rErr("Format email belum benar.");
    if (rStep === 1) {
      rBusy(true);
      post("/api/auth/forgot-password", { email: email }).then(function (d) {
        rStep = 2;
        $("rStep2").hidden = false;
        $("rEmail").readOnly = true;
        rBusy(false, "Ubah kata sandi");
        rOk(d.message || "Kode dikirim ke email.");
        rCooldown();
        $("rCode").focus();
      }).catch(function (err) { rErr(err.message); rBusy(false, "Kirim kode"); });
      return;
    }
    var code = $("rCode").value.trim();
    var pw = $("rPass").value;
    if (!/^\d{6}$/.test(code)) return rErr("Masukkan kode 6 digit dari email.");
    if (pw.length < 8 || pw.length > 128) return rErr("Kata sandi baru harus 8–128 karakter.");
    rBusy(true);
    post("/api/auth/reset-password", { email: email, otp: code, newPassword: pw }).then(function () {
      showReset(false);
      setMode("login");
      $("email").value = email;
      $("password").value = "";
      $("subtitle").textContent = "Kata sandi berhasil diubah. Silakan masuk.";
    }).catch(function (err) { rErr(err.message); rBusy(false, "Ubah kata sandi"); });
  });


  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    fetch("/api/auth/me", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.user) goChat(); })
      .catch(function () {});
  });
})();
</script>
<p id="umaira-legal-links" style="text-align:center;font-size:12px;opacity:.7;margin:16px 0"><a href="/privasi">Kebijakan Privasi</a> · <a href="/syarat">Syarat Penggunaan</a></p></body>
</html>
